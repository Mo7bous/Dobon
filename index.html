            let newDirection = roomState.direction;
            let nextTurnIndex = (fromPlayerIndex + newDirection + roomState.playerOrder.length) % roomState.playerOrder.length;
            let playConstraint = roomState.playConstraint;
            let deck = [...roomState.deck];
            let drawTwoStack = roomState.drawTwoStack || 0;

            if (lastCard.content !== '5') playConstraint = null;
            
            if (lastCard.content === '2') {
                drawTwoStack++;
            } else {
                // Any other card being played means the stack was either 0
                // or the player is playing a non-+2 card, which is invalid if stack > 0.
                // canPlayCard on client side should prevent this.
                // The server should trust the client for now in this implementation.
            }

            switch(lastCard.content) {
                case 'A':
                    nextTurnIndex = (nextTurnIndex + newDirection + roomState.playerOrder.length) % roomState.playerOrder.length;
                    state.room.send({ type: 'gameNotification', message: 'Turn Skipped!' });
                    break;
                case '9':
                    newDirection *= -1;
                    // Recalculate next turn index based on new direction from current player
                    nextTurnIndex = (fromPlayerIndex + newDirection + roomState.playerOrder.length) % roomState.playerOrder.length;
                    state.room.send({ type: 'gameNotification', message: 'Play Reversed!' });
                    break;
                case '5':
                     playConstraint = { type: 'lessThan', value: 5 };
                     const nextPlayerName = state.room.peers[roomState.playerOrder[nextTurnIndex]].username;
                     state.room.send({ type: 'gameNotification', message: `${nextPlayerName}, play 5 or less!` });
                     break;
            }
            
            const currentHistory = {...roomState.moveHistory};
            const newHistory = {};
            newHistory[0] = `${state.room.peers[fromClientId].username} played ${playedCards.length} card(s).`;
            if(lastCard.content === '2') {
                newHistory[0] += ` Stack is now ${drawTwoStack*2}!`;
            }

            const keys = Object.keys(currentHistory).sort((a,b) => a-b);
            for (let i=0; i < 4 && i < keys.length; i++) newHistory[i+1] = currentHistory[keys[i]];

            if (state.room.presence[fromClientId]?.cards.length === 0) {
                // ... (winner logic, seems fine, no changes needed here)
                const winnerId = fromClientId;
                const newScores = { ...roomState.scores };
                const newScoresByRound = { ...roomState.scoresByRound };
                const newHandsByRound = { ...roomState.handsByRound };
                const remainingHands = {};
                
                roomState.playerOrder.forEach(pId => {
                    const currentHand = state.room.presence[pId]?.cards || [];
                    remainingHands[pId] = currentHand;
                    
                    if (!newHandsByRound[pId]) newHandsByRound[pId] = {};
                    newHandsByRound[pId][roomState.currentRound - 1] = currentHand;

                    let roundPoints = 0;
                    if (pId !== winnerId) {
                       roundPoints = calculateHandValue(remainingHands[pId]);
                    }

                    newScores[pId] = (newScores[pId] || 0) + roundPoints;
                    if(!newScoresByRound[pId]) newScoresByRound[pId] = {};
                    newScoresByRound[pId][roomState.currentRound - 1] = roundPoints;
                });

                const roundData = { winnerId: winnerId, scoresByRound: newScoresByRound, finalScores: newScores, handsByRound: newHandsByRound, dobon: false };

                if (roomState.currentRound >= roomState.gameSettings.roundsToWin) {
                     const finalWinnerId = Object.keys(newScores).reduce((a, b) => newScores[a] < newScores[b] ? a : b);
                     state.room.send({ type: 'gameOver', winnerId: finalWinnerId, scoresByRound: newScoresByRound, finalScores: newScores, handsByRound: newHandsByRound });
                     state.room.updateRoomState({ gameStarted: false, scores: newScores, scoresByRound: newScoresByRound, handsByRound: newHandsByRound });
                } else {
                     state.room.send({ type: 'roundOver', ...roundData });
                     state.room.updateRoomState({
                        gameStarted: false,
                        scores: newScores,
                        scoresByRound: newScoresByRound,
                        handsByRound: newHandsByRound,
                        currentRound: roomState.currentRound + 1,
                        nextRoundStarterId: winnerId,
                    });
                }
                return;
            }

            state.room.updateRoomState({
                discardPile: [...roomState.discardPile, ...playedCards],
                currentColor: data.newColor,
                currentTurn: roomState.playerOrder[nextTurnIndex],
                deck: deck,
                direction: newDirection,
                playConstraint: playConstraint,
                drawTwoStack: drawTwoStack,
                lastPlayedCards: playedCards,
                lastPlayerId: fromClientId,
                moveHistory: newHistory,
            });
            break;
        }
        
        case 'drawCard': {
             if (roomState.currentTurn !== fromClientId) return;
             let deck = [...roomState.deck];
             let drawTwoStack = roomState.drawTwoStack || 0;
             let cardsToDraw = [];
             let message = "";

             if(drawTwoStack > 0) {
                 const numToDraw = drawTwoStack * 2;
                 message = `${state.room.peers[fromClientId].username} drew ${numToDraw} cards.`;
                 for(let i = 0; i < numToDraw && deck.length > 0; i++) {
                     cardsToDraw.push(deck.pop());
                 }
                 drawTwoStack = 0; // Reset stack
             } else {
                 message = `${state.room.peers[fromClientId].username} drew a card.`;
                 if (deck.length > 0) {
                     cardsToDraw.push(deck.pop());
                 }
             }

             if(cardsToDraw.length > 0) {
                 state.room.requestPresenceUpdate(fromClientId, {type: 'addCards', cards: cardsToDraw });
             }
             
             const drawNextIndex = (fromPlayerIndex + roomState.direction + roomState.playerOrder.length) % roomState.playerOrder.length;
             const currentHistoryDraw = {...roomState.moveHistory};
             const newHistoryDraw = {};
             newHistoryDraw[0] = message;
             const keysDraw = Object.keys(currentHistoryDraw).sort((a,b) => a-b);
             for (let i=0; i < 4 && i < keysDraw.length; i++) newHistoryDraw[i+1] = currentHistoryDraw[keysDraw[i]];
             
             state.room.updateRoomState({
                 deck: deck,
                 currentTurn: roomState.playerOrder[drawNextIndex],
                 playConstraint: null,
                 drawTwoStack: drawTwoStack,
                 moveHistory: newHistoryDraw,
             });
             break;
        }

        case 'dobonCall':
            if (!roomState.lastPlayedCards || !roomState.lastPlayerId) {
                 state.room.send({ type: 'gameNotification', message: 'No move to call DOBON on!' });
                 return;
            }
            if (roomState.lastPlayerId === fromClientId) {
                state.room.send({ type: 'gameNotification', message: "Can't call DOBON on yourself!" });
                return;
            }

            const callerId = fromClientId;
            const targetId = roomState.lastPlayerId;
            const callerHand = state.room.presence[callerId]?.cards || [];
            const callerHandValue = calculateHandValue(callerHand);
            const lastPlayValue = calculateHandValue(roomState.lastPlayedCards);
            
            state.room.send({ type: 'gameNotification', message: `${state.room.peers[callerId].username} calls DOBON!` });
            
            if (callerHandValue === lastPlayValue) {
                // Correct DOBON call
                const targetHand = state.room.presence[targetId]?.cards || [];
                const lastPlayedCardsValue = calculateHandValue(roomState.lastPlayedCards);
                const penaltyPoints = calculateHandValue(targetHand) + lastPlayedCardsValue;

                const newScores = { ...roomState.scores };
                const newScoresByRound = { ...roomState.scoresByRound };
                const newHandsByRound = { ...roomState.handsByRound };
                const remainingHands = {};
                
                roomState.playerOrder.forEach(pId => {
                    const currentHand = state.room.presence[pId]?.cards || [];
                    remainingHands[pId] = currentHand;
                    
                    if (!newHandsByRound[pId]) newHandsByRound[pId] = {};
                    newHandsByRound[pId][roomState.currentRound - 1] = currentHand;
                    
                    let roundPoints = 0;
                    if (pId === callerId) {
                        roundPoints = 0;
                    } else if (pId === targetId) {
                        roundPoints = penaltyPoints;
                    } else {
                        roundPoints = calculateHandValue(remainingHands[pId]);
                    }

                    newScores[pId] = (newScores[pId] || 0) + roundPoints;
                    if(!newScoresByRound[pId]) newScoresByRound[pId] = {};
                    newScoresByRound[pId][roomState.currentRound - 1] = roundPoints;
                });

                const roundData = { winnerId: callerId, scoresByRound: newScoresByRound, finalScores: newScores, handsByRound: newHandsByRound, dobon: true, targetId: targetId };

                if (roomState.currentRound >= roomState.gameSettings.roundsToWin) {
                     const finalWinnerId = Object.keys(newScores).reduce((a, b) => newScores[a] < newScores[b] ? a : b);
                     state.room.send({ type: 'gameOver', winnerId: finalWinnerId, scoresByRound: newScoresByRound, finalScores: newScores, handsByRound: newHandsByRound });
                     state.room.updateRoomState({ gameStarted: false, scores: newScores, scoresByRound: newScoresByRound, handsByRound: newHandsByRound });
                } else {
                     state.room.send({ type: 'roundOver', ...roundData });
                     state.room.updateRoomState({
                        gameStarted: false,
                        scores: newScores,
                        scoresByRound: newScoresByRound,
                        handsByRound: newHandsByRound,
                        currentRound: roomState.currentRound + 1,
                        nextRoundStarterId: targetId,
                    });
                }
            } else {
                // Wrong DOBON call
                if (roomState.deck.length >= 2) {
                    const penaltyCards = [roomState.deck.pop(), roomState.deck.pop()];
                    state.room.requestPresenceUpdate(callerId, { type: 'addCards', cards: penaltyCards });
                    state.room.updateRoomState({ deck: roomState.deck });
                    state.room.send({ type: 'gameNotification', message: `${state.room.peers[callerId].username} made a wrong call! +2 Penalty.` });
                } else {
                     state.room.send({ type: 'gameNotification', message: 'Wrong call! No penalty cards left.' });
                }
            }
            break;
    }
}


// --- MAIN LOGIC (from main.js) ---

// --- Core Game Actions ---
function toggleCardSelection(index) {
    if (!isMyTurn()) return;

    const hand = state.isSoloMode ? state.soloGame.playerHand : state.room?.presence[state.room.clientId]?.cards;
    if (!hand) return;
    
    const card = hand[index];
    const topCard = getTopCard();

    const aPos = state.selectedCardsIndices.indexOf(index);
    if (aPos !== -1) {
        // Deselect
        state.selectedCardsIndices.splice(aPos, 1);
    } else {
        // Select
        if (state.selectedCardsIndices.length === 0) {
            // First card
            if (canPlayCard(card, topCard)) {
                state.selectedCardsIndices.push(index);
            }
        } else {
            // Subsequent card, must match content
            const firstSelectedCard = hand[state.selectedCardsIndices[0]];
            if (card.content === firstSelectedCard.content) {
                state.selectedCardsIndices.push(index);
            }
        }
    }
    
    document.getElementById('play-selected-button').style.display = state.selectedCardsIndices.length > 0 ? 'block' : 'none';
    updatePlayerHandUI();
}

function playSelected() {
    if (!isMyTurn() || state.selectedCardsIndices.length === 0) return;

    if (state.isSoloMode) {
        soloPlaySelectedCards();
    } else {
        multiPlaySelectedCards();
    }
    
    state.selectedCardsIndices = [];
    document.getElementById('play-selected-button').style.display = 'none';
    updatePlayerHandUI();
}

function drawCard() {
    if (!isMyTurn()) return;
    if (state.selectedCardsIndices.length > 0) return; // Can't draw if cards are selected
    if(state.isSoloMode) {
        soloDrawCard();
    } else {
        multiDrawCard();
    }
}

function callDobon() {
    if (state.isSoloMode) {
        soloCallDobon();
    } else {
        multiCallDobon();
    }
}

function selectSuit(suit) {
    hideColorPicker();
    
    if (state.isSoloMode) {
        state.soloGame.currentColor = suit;
        updateSoloMoveHistory(`You changed the suit to ${suitSymbols[suit]}.`);
        handleSpecialCardEffect({content: '8', color: 'wild'});
        advanceTurn();
        return;
    }

    if (!state.tempWildCard || !state.tempWildCard.cards) return;
    
    state.room.send({
        type: 'playCards',
        cards: state.tempWildCard.cards,
        newColor: suit
    });
    state.tempWildCard = null;
}

function leaveLobby() {
    window.location.reload();
}

function confirmExit() {
    document.getElementById('confirm-exit-modal').style.display = 'flex';
}

function init() {
    // --- Event Listeners ---
    document.getElementById('create-server-button').onclick = () => createServer();
    document.getElementById('show-ai-setup-button').onclick = showAiSetup;

    document.getElementById('rounds-select').onchange = () => updateGameSettings();
    document.getElementById('ready-button').onclick = () => toggleReady();
    document.getElementById('start-button').onclick = () => startMultiplayerGame();
    document.getElementById('leave-lobby-button').onclick = leaveLobby;
    
    document.getElementById('copy-url-button').onclick = () => {
        const urlInput = document.getElementById('lobby-url');
        urlInput.select();
        document.execCommand('copy');
        showGameNotification('URL Copied!');
    };

    document.getElementById('exit-button').onclick = confirmExit;
    document.getElementById('draw-pile').onclick = drawCard;
    document.getElementById('play-selected-button').onclick = playSelected;
    
    document.getElementById('dobon-button').onclick = callDobon;
    document.getElementById('scoreboard-icon-button').onclick = showScoreboard;
    
    document.getElementById('color-picker').querySelectorAll('button').forEach(btn => {
        btn.onclick = () => selectSuit(btn.dataset.suit);
    });

    document.getElementById('next-round-button').onclick = () => {
        if(state.isSoloMode) {
             startNextSoloRound();
        } else {
             startNextRound();
        }
    };
    document.getElementById('back-to-menu-button').onclick = leaveLobby;

    document.getElementById('start-ai-game-button').onclick = () => {
        const numBots = parseInt(document.getElementById('ai-players-select').value, 10);
        const roundsToWin = parseInt(document.getElementById('ai-rounds-select').value, 10);
        hideAiSetup();
        startSoloMode({numBots, roundsToWin});
    };
    document.getElementById('cancel-ai-setup-button').onclick = hideAiSetup;

    document.getElementById('confirm-exit-yes-button').onclick = () => {
        document.getElementById('confirm-exit-modal').style.display = 'none';
        leaveLobby();
    };
    document.getElementById('confirm-exit-no-button').onclick = () => {
        document.getElementById('confirm-exit-modal').style.display = 'none';
    };

    document.getElementById('round-cards-modal-close').onclick = () => {
        document.getElementById('round-cards-modal').style.display = 'none';
    };

    // --- Initial UI Setup ---
    updatePlayerHandUI();
}

// --- Make functions available globally for UI module ---
window.toggleCardSelection = toggleCardSelection;
window.startNextSoloRound = startNextSoloRound;
window.advanceTurn = advanceTurn;
window.startNextRound = startNextRound;
window.showRoundCards = showRoundCards;

// --- Initialize ---
init();

  </script>
